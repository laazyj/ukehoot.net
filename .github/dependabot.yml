version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Hold new releases for a week so a compromised or yanked version has
    # time to be caught upstream before it lands here.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      # composurecdk is pre-1.0, so a minor bump is breaking by semver
      # convention. Keep these out of the routine batch and review
      # together as their own PR.
      composurecdk:
        patterns:
          - "@composurecdk/*"
        update-types: [minor, patch, major]
      # aws-cdk-lib bakes its own defaults into every synthesised template,
      # so a routine minor bump can rewrite the CDK snapshots on its own
      # (2.268.0 moved the BucketDeployment handler to arm64, for instance).
      # Group the CDK packages so that churn lands in a PR of its own,
      # where refreshing the snapshots is the expected review.
      aws-cdk:
        patterns:
          - "aws-cdk"
          - "aws-cdk-lib"
          - "constructs"
        update-types: [minor, patch, major]
      minor-and-patch:
        patterns:
          - "*"
        exclude-patterns:
          - "@composurecdk/*"
          - "aws-cdk"
          - "aws-cdk-lib"
          - "constructs"
        update-types: [minor, patch]
    ignore:
      # TypeScript 7.0 lacks the compiler APIs typescript-eslint needs; 7.1
      # adds them. Its PR stays red until typescript-eslint's peer range
      # accepts 7.1, so merge it then and drop this entry.
      - dependency-name: "typescript"
        versions: [">=7.0.0 <7.1.0"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      actions:
        update-types: [minor, patch, major]

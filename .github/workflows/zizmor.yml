name: zizmor

# Static analysis of our GitHub Actions workflows and Dependabot config.
# See README.md "GitHub Actions audit" for running it locally.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions: {}

concurrency:
  group: zizmor-${{ github.ref }}
  # Only superseded PR runs: a cancelled run on main would leave that commit unaudited.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  zizmor:
    name: zizmor
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b # v0.8.0
        with:
          # Fail the job and annotate the PR inline, rather than uploading
          # SARIF to code scanning (which reports but never fails the job).
          advanced-security: false
          annotations: true

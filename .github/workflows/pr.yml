name: pr

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  AWS_REGION: eu-west-2

concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npm run verify

  cdk-diff:
    name: cdk diff
    runs-on: ubuntu-latest
    # Runs the PR's code with AWS credentials, so only for PRs from people trusted with
    # this repository: an inclusion list, so bots (Dependabot, DependaBuddy, any added
    # later), forks and other contributors are all left out without being named.
    #   - The PR comes from a branch in this repository, not a fork.
    #   - Its author is a person, not an App: Dependabot and DependaBuddy count as
    #     CONTRIBUTOR once they have commits here, so the association alone isn't enough.
    #   - Its author is the owner, an organisation member or an invited collaborator.
    #   - The push that triggered this run is the author's own.
    # The verify job still runs for every PR.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.type == 'User' &&
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.pull_request.author_association) &&
      github.triggering_actor == github.event.pull_request.user.login
    needs: verify
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    env:
      ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
      GA_MEASUREMENT_ID: ${{ vars.GA_MEASUREMENT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        id: aws
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: cdk synth
        env:
          CDK_DEFAULT_ACCOUNT: ${{ steps.aws.outputs.aws-account-id }}
          CDK_DEFAULT_REGION: ${{ env.AWS_REGION }}
        run: npm run cdk:synth

      - name: cdk diff
        uses: corymhall/cdk-diff-action@ad67041313333f7f2bd26b33f18fb134610a971e # v2.0.9
        with:
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          cdkOutDir: packages/cdk/cdk.out
          failOnDestructiveChanges: false
